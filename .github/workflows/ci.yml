name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Dummy values so `prisma generate` / typecheck / build never need a real DB.
    # All DB access in tests is mocked; no migrations run here.
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      DATABASE_URL_UNPOOLED: "postgresql://user:pass@localhost:5432/db"
      BETTER_AUTH_SECRET: "ci-placeholder-secret-not-used-at-runtime"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
